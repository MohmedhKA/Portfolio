const crc=s=>{let c=-1;for(const ch of s){c^=ch.charCodeAt(0);for(let k=0;k<8;k++)c=c&1?(c>>>1)^0xEDB88320:c>>>1}return((c^-1)>>>0).toString(16).toUpperCase().padStart(8,'0')};
let W,H,parts=[],TXL,TXW,TCY,capH,HZ=.12;
function sample(){
 const w='WELCOME',o=document.createElement('canvas'),fs=200,sx=.56,fnt=`bold ${fs}px "Times New Roman",Times,Georgia,serif`;
 let x=o.getContext('2d');x.font=fnt;
 const ws=[...w].map(c=>x.measureText(c).width*sx),cap=fs*.66,rows=M.max(10,M.min(18,M.round(H*.26/14)));
 const ar=ws.reduce((a,b)=>a+b,0)/cap+6*.6*1.6/rows;                          // 1.6 empty columns between letters: no overlap
 capH=M.min(H*.26,W*.9/ar);const capW=capH*ar,rh=capH/rows,cw=rh*.6,sc=capH/cap,gap=cw*1.6;
 o.width=M.ceil(capW)+4;o.height=M.ceil(capH*1.1)+4;x=o.getContext('2d',{willReadFrequently:true});x.fillStyle='#fff';x.textBaseline='alphabetic';x.font=fnt;x.strokeStyle='#fff';x.lineWidth=fs*.04;
 let px=2;[...w].forEach((c,i)=>{x.setTransform(sx*sc,0,0,sc,px,2+capH*.04);x.fillText(c,0,cap);x.strokeText(c,0,cap);px+=ws[i]*sc+gap});
 const d=x.getImageData(0,0,o.width,o.height).data;TXL=W/2-capW/2;TXW=capW;TCY=H*.44;
 const A=(X,Y)=>{X|=0;Y|=0;return X<0||Y<0||X>=o.width||Y>=o.height?0:d[(Y*o.width+X)*4+3]},out=[],T0=TCY-capH/2;
 for(let r=0;r<rows;r++)for(let c=0,n=M.floor(capW/cw);c<n;c++){const X=2+(c+.5)*cw,Y=2+capH*.04+(r+.5)*rh;
  if(A(X,Y)+A(X-cw*.3,Y)+A(X+cw*.3,Y)+A(X,Y-rh*.3)+A(X,Y+rh*.3)>330)out.push({x:TXL+(c+.5)*cw,y:T0+(r+.5)*rh,ts:rh*.83})}
 return out}
function build(){
 W=innerWidth;H=innerHeight;gc.width=oc.width=W*D|0;gc.height=oc.height=H*D|0;
 const pts=sample(),hy=(1-HZ)/2*H;
 parts=BG?[]:pts.map((s,i)=>{const a=R()*TAU,sx=W/2+M.cos(a)*W*(.55+R()*.35),sy=H/2+M.sin(a)*H*(.55+R()*.35),an=M.atan2(s.y-TCY,s.x-W/2),m=(80+R()*200);
  return{bit:+BS[i%56],tx:s.x,ty:s.y,ts:s.ts,sx,sy,qx:(sx+s.x)/2+(R()-.5)*W*.35,qy:(sy+s.y)/2+(R()-.5)*H*.35,a0:.35+(s.x-TXL)/TXW*1.9+R()*.5,ad:1+R()*.7,
   pd:M.hypot((s.x-W/2)/(TXW/2),(s.y-TCY)/(capH/2)*.4)*.9+R()*.4,fd:1.6+R()*1.2,cx:s.x+M.cos(an)*m,cy:s.y+M.sin(an)*m*.6-(60+R()*200),hx:W*(.06+.88*R()),hy:hy+(R()-.5)*10,ph:R()}})}
// ---------- state ----------
let t0=performance.now()/1000,TP=BG?.2:HOLD,lt=0,ei=0,lines=[],mx=.5,my=.5,smx=.5,smy=.5,pa=0,pe=0,pxv=0,pyv=0;
let fr2=0,tgt=0,cz=0,pz=0,spd=0,cy=null,q=innerWidth<700?.55:1,acc=0,fn=0,fps=60,fcT=0,fcN=0;
const EV=[[.1,0,'$ ./decode --in 0x57454C434F4D45'],[.8,0,'[ ok ] entropy pool seeded · 4096 bits'],[1.6,0,()=>`[ .. ] aligning payload “WELCOME” · ${parts.length} bits`],
 [4.1,0,()=>`[ ok ] frame lock · crc32 0x${crc('WELCOME')}`],[5.4,0,'[ .. ] arming burst'],[0,1,'[ !! ] bitburst · payload dispersed to horizon'],
 [3.5,1,()=>`[ ok ] field online · ${BD.reduce((n,b)=>n+b[4],0)} instanced blades · 1 draw / LOD band`],[4.5,1,()=>`[ ok ] sky online · ${NB} boids · ${clV.n} cloud bits · 1 draw each`],[5,1,'[ >> ] scroll or drag to walk the field']];
function frame(ms){
 requestAnimationFrame(frame);
 if(BG&&pe<.02&&M.abs(spd)<1.5&&ms/1000-t0>TP+6&&(fr2++&1))return;
 const t=ms/1000-t0,dt=M.min(.05,M.max(.001,t-lt));lt=t;
 while(ei<EV.length){const e=EV[ei];if(t<(e[1]?TP+e[0]:e[0]))break;if(!e[1]&&t>=TP){ei++;continue}
  lines.push(typeof e[2]==='function'?e[2]():e[2]);if(lines.length>7)lines.shift();ei++;hud.textContent=lines.join('\n')+'\n▌'}
 // adaptive quality (instance count) from measured frame time
 acc+=dt;fn++;fcN++;if(fn>=45){const a=acc/fn;if(a>.024)q=M.max(.3,q*.8);else if(a<.0145)q=M.min(1,q*1.08);acc=fn=0}
 if(t-fcT>.5){fps=M.round(fcN/(t-fcT));fcN=0;fcT=t;stat.textContent=t<TP?`bits ${parts.filter(p=>t>p.a0+p.ad).length} / ${parts.length}   fps ${fps}`:`z ${cz.toFixed(1)} m   addr 0x${((cz*64)>>>0).toString(16).toUpperCase().padStart(6,'0')}   fps ${fps}   lod ${M.round(q*100)}%`}
 // ---------- intro: 2D bit text ----------
 o2.setTransform(D,0,0,D,0,0);o2.clearRect(0,0,W,H);
 if(t<TP+4.5){const g=(t-4.3)/1.7;
  for(const p of parts){if(t<p.a0)continue;const ft=t-TP-p.pd;let x,y,sz,al,hv=0,bit=p.bit;
   if(ft<0){const u=(t-p.a0)/p.ad;
    if(u<1){const e=1-M.pow(1-u,3),k=1-e;x=k*k*p.sx+2*k*e*p.qx+e*e*p.tx;y=k*k*p.sy+2*k*e*p.qy+e*e*p.ty;sz=p.ts*(.6+.4*e);al=M.min(1,u*4)*.9;bit=((t*16+p.ph*50)|0)&1}
    else{x=p.tx;y=p.ty;sz=p.ts;al=.9+.1*M.sin(t*3+p.ph*9);hv=M.max(0,1-(u-1)*p.ad/.5);if(g>0&&g<1)hv=M.max(hv,M.exp(-M.pow((p.tx-(TXL+g*TXW))/55,2)*.5)*.95)}}
   else if(ft<.22){x=p.tx;y=p.ty;sz=p.ts*(1+M.sin(ft/.22*1.57));al=1;hv=1}
   else{const u=(ft-.22)/p.fd;if(u>=1)continue;const e=1-M.pow(1-u,2.3),k=1-e;x=k*k*p.tx+2*k*e*p.cx+e*e*p.hx;y=k*k*p.ty+2*k*e*p.cy+e*e*p.hy;sz=p.ts*2*k+2.5*e;al=M.pow(k,1.2);hv=M.max(0,1-ft/.9);bit=((t*16+p.ph*50)|0)&1}
   const w=40*sz/24;o2.globalAlpha=al>1?1:al;o2.drawImage(SP[hv>.65?2:hv>.25?1:0][bit],x-w/2,y-w/2,w,w)}
  const ra=t-TP;if(ra>0&&ra<1.6){o2.globalAlpha=1;o2.strokeStyle=`rgba(255,214,150,${(1-ra/1.6)*.55})`;o2.lineWidth=2;o2.beginPath();o2.arc(W/2,TCY,ra*1400,0,TAU);o2.stroke()}}
 // ---------- field ----------
 const em=t-TP-.3;
 if(em>-1){
  if(t>TP+1)tgt+=.7*dt;cz+=(tgt-cz)*(1-M.exp(-dt*3.5));spd+=((cz-pz)/dt-spd)*.1;spd=M.max(-30,M.min(30,spd));pz=cz;
  smx+=(mx-smx)*.05;smy+=(my-smy)*.05;pe+=(pa-pe)*.05;
  const cxw=M.sin(t*.11)*2+(smx-.5)*3,ty=HJ(cxw,cz)+3.2;if(cy===null)cy=ty;cy+=(ty-cy)*(1-M.exp(-dt*6));
  const F=1.5-M.min(M.abs(spd),40)*.006,asp=gc.width/gc.height,sxs=(smx-.5)*.04;gF=F;gA=asp;const nA=M.max(30,M.floor(NB*q));boids(dt,t,cxw,cy,cz,nA);
  gl.viewport(0,0,gc.width,gc.height);gl.clearColor(0,0,0,0);gl.clear(gl.COLOR_BUFFER_BIT|gl.DEPTH_BUFFER_BIT);
  gl.useProgram(PP);gl.activeTexture(gl.TEXTURE0);gl.bindTexture(gl.TEXTURE_2D,tex);gl.uniform1i(UP.uTex,0);gl.uniform3f(UP.uCam,cxw,cy,cz);gl.uniform2f(UP.uRes,gc.width,gc.height);
  gl.uniform1f(UP.uT,t);gl.uniform1f(UP.uF,F);gl.uniform1f(UP.uHz,HZ);gl.uniform1f(UP.uAsp,asp);gl.uniform1f(UP.uDpr,D);gl.uniform1f(UP.uSx,sxs);gl.uniform1f(UP.uEm,em);gl.uniform3f(UP.uOff,0,0,0);
  gl.disable(gl.DEPTH_TEST);gl.enable(gl.BLEND);gl.blendFunc(gl.ONE,gl.ONE_MINUS_SRC_ALPHA);gl.uniform1f(UP.uMode,0);gl.bindVertexArray(clV.v);gl.drawArrays(gl.POINTS,0,clV.n);   // clouds first (behind terrain)
  gl.enable(gl.DEPTH_TEST);gl.depthFunc(gl.LEQUAL);gl.depthMask(true);gl.disable(gl.BLEND);
  gl.useProgram(PT);gl.uniform3f(UT.uCam,cxw,cy,cz);gl.uniform1f(UT.uF,F);gl.uniform1f(UT.uHz,HZ);gl.uniform1f(UT.uAsp,asp);gl.uniform1f(UT.uSx,sxs);gl.uniform1f(UT.uK,M.min(1,M.max(0,em*1.2)));
  gl.bindVertexArray(vaoT);gl.drawElements(gl.TRIANGLES,ti.length,gl.UNSIGNED_SHORT,0);
  gl.enable(gl.BLEND);gl.blendFunc(gl.ONE,gl.ONE_MINUS_SRC_ALPHA);gl.useProgram(PP);gl.uniform1f(UP.uMode,1);gl.bindVertexArray(bnV.v);   // barn first (writes depth) so grass in front of it covers its base and grass behind it is hidden
  for(let k=M.floor((cz-240)/560),ke=k+1;k<=ke;k++){const bz=240+560*k,dz=bz-cz;if(dz<3||dz>135)continue;const hk=M.abs(M.sin(k*12.9898)*43758.5453)%1,bx=(k&1?1:-1)*(28+hk*16);gl.uniform3f(UP.uOff,bx,HJ(bx,bz)-.7,bz);gl.drawArrays(gl.POINTS,0,bnV.n)}
  gl.depthMask(false);gl.enable(gl.BLEND);gl.blendFunc(gl.ONE,gl.ONE_MINUS_SRC_ALPHA);
  gl.useProgram(PB);gl.bindVertexArray(vaoB);gl.activeTexture(gl.TEXTURE0);gl.bindTexture(gl.TEXTURE_2D,tex);gl.uniform1i(UB.uTex,0);
  gl.uniform3f(UB.uCam,cxw,cy,cz);gl.uniform3f(UB.uP,pxv/W*2-1,1-pyv/H*2,pe);gl.uniform2f(UB.uRes,gc.width,gc.height);
  gl.uniform1f(UB.uT,t);gl.uniform1f(UB.uF,F);gl.uniform1f(UB.uHz,HZ);gl.uniform1f(UB.uEm,em);gl.uniform1f(UB.uSp,spd);gl.uniform1f(UB.uAsp,asp);gl.uniform1f(UB.uDpr,D);gl.uniform1f(UB.uSx,sxs);
  for(let i=BD.length-1;i>=0;i--){const b=BD[i];gl.uniform4f(UB.uBand,b[0],b[1],b[2],b[3]);gl.drawArraysInstanced(gl.TRIANGLE_STRIP,0,8,M.floor(b[4]*q))}
  gl.useProgram(PP);gl.uniform3f(UP.uOff,0,0,0);gl.uniform1f(UP.uMode,2);gl.bindVertexArray(brV.v);gl.bindBuffer(gl.ARRAY_BUFFER,brV.b);gl.bufferSubData(gl.ARRAY_BUFFER,0,brV.a,0,nA*24);gl.drawArrays(gl.POINTS,0,nA*3);   // boid birds
  hint.style.opacity=t>TP+5?1:0}
}
function restart(){t0=performance.now()/1000;TP=BG?.2:HOLD;ei=0;lines=[];hud.textContent='';lt=0;fcT=0;tgt=cz=pz=0;gc.getContext('webgl2');}
const now=()=>performance.now()/1000-t0;
addEventListener('wheel',e=>{e.preventDefault();tgt+=e.deltaY*.035},{passive:false});
let ly=0;addEventListener('touchstart',e=>{ly=e.touches[0].clientY},{passive:true});
addEventListener('touchmove',e=>{const y=e.touches[0].clientY;tgt+=(ly-y)*.06;ly=y;pxv=e.touches[0].clientX;pyv=y;pa=1},{passive:true});
addEventListener('touchend',()=>setTimeout(()=>pa=0,500));
addEventListener('pointermove',e=>{if(e.pointerType==='touch')return;pxv=e.clientX;pyv=e.clientY;pa=1;mx=pxv/W;my=pyv/H});
addEventListener('pointerdown',()=>{const t=now();if(t>4&&t<TP)TP=t});
document.documentElement.addEventListener('mouseleave',()=>pa=0);
addEventListener('keydown',e=>{const k=e.key;if(k==='r'||k==='R')restart();else if(k==='ArrowDown'||k==='PageDown'||k===' ')tgt+=6;else if(k==='ArrowUp'||k==='PageUp')tgt-=6});
$('rp').addEventListener('pointerdown',e=>{e.stopPropagation();restart()});
$('rp').style.pointerEvents='auto';hint.style.pointerEvents='none';
let rz;addEventListener('resize',()=>{clearTimeout(rz);rz=setTimeout(build,150)});
build();requestAnimationFrame(frame);
})();
</script>
